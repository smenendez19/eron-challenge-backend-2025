version: '3.8'

services:
  eron-challenge-backend:
    container_name: eron-challenge-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
      - EXTERNAL_API_URL=https://wiremock.dev.eroninternational.com/api
    networks:
      - eron-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  eron-network:
    driver: bridge
